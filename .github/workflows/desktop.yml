name: Desktop packages
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [dev, stable]
        default: dev
      sdk_index_url:
        description: HTTPS URL of pinned SDK index (three target records)
        required: true
      sdk_index_sha256:
        description: SHA-256 of the SDK index bytes
        required: true
      publish:
        description: Publish signed installers to this desktop update channel
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-package-${{ inputs.channel }}
  cancel-in-progress: false
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: win32-x64
            arch: x64
          - runner: macos-15
            target: darwin-arm64
            arch: arm64
          - runner: macos-15-intel
            target: darwin-x64
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      SONGLOFT_DESKTOP_CHANNEL: ${{ inputs.channel }}
      SONGLOFT_BACKEND_SOURCE: ${{ github.workspace }}/backend-source
      SONGLOFT_DESKTOP_SDK: ${{ github.workspace }}/desktop-sdk
      SONGLOFT_MPV_ROOT: ${{ github.workspace }}/desktop-sdk/build
      SDK_INDEX_URL: ${{ inputs.sdk_index_url }}
      SDK_INDEX_SHA256: ${{ inputs.sdk_index_sha256 }}
      DESKTOP_TARGET: ${{ matrix.target }}
      # Hash the same checked-out source bytes on all three runners.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          architecture: ${{ matrix.arch }}
      - name: Configure update signing key
        env:
          UPDATE_PUBLIC_KEY: ${{ secrets.DESKTOP_UPDATE_PUBLIC_KEY }}
          REQUIRE_UPDATE_KEY: ${{ inputs.publish || inputs.channel == 'stable' }}
        run: node desktop/scripts/ci-signing.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: desktop/updater/go.mod
      - name: Read backend pin
        id: backend
        run: node -e 'console.log("sha="+JSON.parse(require("fs").readFileSync("desktop/backend.lock.json")).commit)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: songloft-org/songloft
          ref: ${{ steps.backend.outputs.sha }}
          path: backend-source
          persist-credentials: false
      - name: Initialize pinned Go dependency
        working-directory: backend-source
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.backend.outputs.sha }}"
          if ! git grep -q 'parent-watch-stdin' HEAD -- internal/app/app.go; then
            echo "::error::Advance desktop/backend.lock.json to the backend commit that supports parent-watch-stdin."
            exit 1
          fi
          GIT_TERMINAL_PROMPT=0 git submodule update --init --depth 1 pkg/tag
      - name: Download and verify SDK
        run: node desktop/scripts/fetch-sdk.mjs
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile
      - name: Shared regression
        run: |
          pnpm typecheck
          pnpm desktop:build
          pnpm test
          pnpm test:release
          pnpm desktop:test
      - name: Native build and helper tests
        run: |
          pnpm --dir desktop build:native
          cd desktop/updater
          go test ./...
      - name: macOS text input shortcut guard
        if: runner.os == 'macOS'
        run: |
          clang++ -std=c++17 -fobjc-arc -framework AppKit desktop/tests/keyboard-focus-test.mm -o desktop/.build/${{ matrix.target }}/keyboard-focus-test
          desktop/.build/${{ matrix.target }}/keyboard-focus-test
      - name: Build complete resources and installers
        env:
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && secrets.DESKTOP_WINDOWS_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.DESKTOP_WINDOWS_CSC_KEY_PASSWORD || '' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.DESKTOP_MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.DESKTOP_MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.DESKTOP_APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.DESKTOP_APPLE_APP_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.DESKTOP_APPLE_TEAM_ID || '' }}
          SONGLOFT_APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.DESKTOP_APPLE_TEAM_ID || '' }}
        run: |
          pnpm --dir desktop build:resources
          pnpm --dir desktop package
      - name: Verify Windows installer signature
        if: runner.os == 'Windows' && (inputs.publish || inputs.channel == 'stable')
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem "desktop/release/$env:SONGLOFT_DESKTOP_CHANNEL/$env:DESKTOP_TARGET" -Filter *.exe -File)
          if ($installer.Count -ne 1) { throw 'Expected one Windows installer' }
          if ((Get-AuthenticodeSignature $installer[0].FullName).Status -ne 'Valid') {
            throw 'Windows installer requires a trusted Authenticode signature'
          }
      - name: Install and verify Windows Bundle
        if: runner.os == 'Windows'
        timeout-minutes: 7
        shell: pwsh
        env:
          REQUIRE_SIGNATURE: ${{ inputs.publish || inputs.channel == 'stable' }}
        run: |
          $directory = "desktop/release/$env:SONGLOFT_DESKTOP_CHANNEL/$env:DESKTOP_TARGET"
          $installer = @(Get-ChildItem $directory -Filter *.exe -File)
          if ($installer.Count -ne 1) { throw 'Expected one Windows installer' }
          $installation = Join-Path $env:RUNNER_TEMP "Songloft package $([guid]::NewGuid())"
          # NSIS expects /D last and unquoted, including paths that contain spaces.
          $result = Start-Process -FilePath $installer[0].FullName -ArgumentList "/S /D=$installation" -PassThru -Wait
          if ($result.ExitCode -ne 0) { throw "NSIS exited with code $($result.ExitCode)" }
          $appName = if ($env:SONGLOFT_DESKTOP_CHANNEL -eq 'dev') { 'SongloftDev.exe' } else { 'Songloft.exe' }
          $app = Get-Item -LiteralPath (Join-Path $installation $appName)
          if ($env:REQUIRE_SIGNATURE -eq 'true' -and (Get-AuthenticodeSignature $app.FullName).Status -ne 'Valid') {
            throw 'Installed application requires a trusted Authenticode signature'
          }
          $resources = Join-Path $installation 'resources/songloft'
          foreach ($file in @('native/songloft_mpv.node', 'updater/songloft-update.exe')) {
            Get-Item -LiteralPath (Join-Path $resources $file) | Out-Null
          }
          $mpv = @(Get-ChildItem -LiteralPath "$resources/native" -File | Where-Object Name -Match '^(lib)?mpv-2\.dll$')
          if ($mpv.Count -ne 1) { throw 'Expected one installed libmpv runtime' }
          foreach ($file in @('cef_extension.node', 'cef_subprocess.exe', 'libcef.dll')) {
            if (!(Get-ChildItem -LiteralPath $installation -Recurse -File -Filter $file)) {
              throw "Missing installed CEF resource $file"
            }
          }
          if ((Get-FileHash "$resources/build-info.json").Hash -ne (Get-FileHash "desktop/resources/$env:DESKTOP_TARGET/build-info.json").Hash) {
            throw 'Installed build metadata does not match packaged identity'
          }
          if ((Get-FileHash "$resources/app/main.lynx.bundle").Hash -ne (Get-FileHash "dist/main.lynx.bundle").Hash) {
            throw 'Installed business bundle does not match the build'
          }
          $env:Path = "$resources/native;$env:Path"
          node desktop/tests/backend-integration.mjs "$resources/backend/songloft.exe" "$resources/tools" --build-info "$resources/build-info.json"
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows backend test failed' }
      - name: Verify macOS installers and Bundle
        if: runner.os == 'macOS'
        timeout-minutes: 7
        run: |
          set -euo pipefail
          directory="desktop/release/$SONGLOFT_DESKTOP_CHANNEL/$DESKTOP_TARGET"
          dmgs=("$directory"/*.dmg)
          zips=("$directory"/*.zip)
          test "${#dmgs[@]}" -eq 1
          test -f "${dmgs[0]}"
          test "${#zips[@]}" -eq 1
          test -f "${zips[0]}"
          hdiutil verify "${dmgs[0]}"
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          ditto -x -k "${zips[0]}" "$stage"
          apps=("$stage"/*.app)
          test "${#apps[@]}" -eq 1
          app="${apps[0]}"
          test -d "$app"
          codesign --verify --deep --strict "$app"
          if [ "$SONGLOFT_DESKTOP_CHANNEL" = stable ]; then
            xcrun stapler validate "$app"
            spctl --assess --type execute "$app"
          fi
          resources="$app/Contents/Resources/songloft"
          cmp "$resources/build-info.json" "desktop/resources/$DESKTOP_TARGET/build-info.json"
          cmp "$resources/app/main.lynx.bundle" dist/main.lynx.bundle
          test -f "$resources/native/songloft_mpv.node"
          test -f "$resources/native/lib/libmpv.2.dylib"
          test -x "$resources/updater/songloft-update"
          node desktop/tests/backend-integration.mjs "$resources/backend/songloft" "$resources/tools" --build-info "$resources/build-info.json"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ inputs.channel }}-${{ matrix.target }}
          path: |
            desktop/release/${{ inputs.channel }}/${{ matrix.target }}/*.exe
            desktop/release/${{ inputs.channel }}/${{ matrix.target }}/*.dmg
            desktop/release/${{ inputs.channel }}/${{ matrix.target }}/*.zip
            desktop/resources/${{ matrix.target }}/build-info.json
          if-no-files-found: error

  publish:
    if: inputs.publish && github.repository == 'songloft-org/songloft-player-lynx'
    needs: desktop
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      CHANNEL: ${{ inputs.channel }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - run: pnpm --dir desktop install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-${{ inputs.channel }}-*
          path: desktop-builds
      - name: Verify release source and read published manifests
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = stable ]; then
            version=$(node -p 'require("./package.json").version')
            test "$GITHUB_REF" = "refs/tags/v$version"
          else
            test "$GITHUB_REF" = refs/heads/main
            test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          fi
          tag="desktop-$CHANNEL"
          mkdir desktop-previous
          if gh release view "$tag" --json assets --jq '.assets[].name' > desktop-existing.txt; then
            for target in win32-x64 darwin-arm64 darwin-x64; do
              name="desktop-$target.json"
              if grep -Fxq "$name" desktop-existing.txt; then
                gh release download "$tag" --pattern "$name" --dir desktop-previous
              fi
            done
          fi
      - name: Prepare signed desktop manifests
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.DESKTOP_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${UPDATE_PRIVATE_KEY:?Configure DESKTOP_UPDATE_PRIVATE_KEY to publish desktop updates}"
          umask 077
          export SONGLOFT_DESKTOP_UPDATE_PRIVATE_KEY="$RUNNER_TEMP/desktop-update-private.pem"
          trap 'rm -f "$SONGLOFT_DESKTOP_UPDATE_PRIVATE_KEY"' EXIT
          printf '%s\n' "$UPDATE_PRIVATE_KEY" > "$SONGLOFT_DESKTOP_UPDATE_PRIVATE_KEY"
          node desktop/scripts/prepare-release.mjs "$CHANNEL" "$GITHUB_SHA" desktop-builds desktop-publish desktop-previous
      - name: Publish installers before updating channel manifests
        run: |
          set -euo pipefail
          tag="desktop-$CHANNEL"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Songloft Lynx Desktop ($CHANNEL)" \
              --notes "Windows and macOS installers. Download the installer for your architecture." \
              --draft --prerelease --latest=false
          fi
          for asset in desktop-publish/assets/*; do
            if ! grep -Fxq "${asset##*/}" desktop-existing.txt; then
              gh release upload "$tag" "$asset"
            fi
          done
          gh release upload "$tag" desktop-publish/manifests/*.json --clobber
          gh release edit "$tag" --draft=false --prerelease --latest=false
