name: Transfer Lynx release signing configuration

on: workflow_dispatch

permissions: {}

jobs:
  encrypt:
    if: github.repository == 'songloft-org/songloft-player-lynx' && github.ref == 'refs/heads/main' && github.actor == 'hanxi'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure LibSodium is available
        run: |
          if ! python3 -c 'from ctypes.util import find_library; assert find_library("sodium")'; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libsodium23
          fi
      - name: Encrypt signing material to the backend repository public key
        env:
          BACKEND_ACTIONS_PUBLIC_KEY: '8b7w1lusADfQ8o8IeErkQze+kH1ouhOJhIuil4JKTkI='
          DESKTOP_UPDATE_PUBLIC_KEY: ${{ secrets.DESKTOP_UPDATE_PUBLIC_KEY }}
          DESKTOP_UPDATE_PRIVATE_KEY: ${{ secrets.DESKTOP_UPDATE_PRIVATE_KEY }}
          LYNX_UPDATE_PRIVATE_KEY: ${{ secrets.LYNX_UPDATE_PRIVATE_KEY }}
          LYNX_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LYNX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LYNX_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LYNX_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import ctypes
          from ctypes.util import find_library
          import json
          import os
          from pathlib import Path

          public_key = base64.b64decode(os.environ['BACKEND_ACTIONS_PUBLIC_KEY'], validate=True)
          sodium = ctypes.CDLL(find_library('sodium'))
          if sodium.sodium_init() < 0 or len(public_key) != sodium.crypto_box_publickeybytes():
              raise RuntimeError('Invalid encryption configuration')
          seal = sodium.crypto_box_seal
          seal.argtypes = (ctypes.c_void_p, ctypes.c_char_p, ctypes.c_ulonglong, ctypes.c_char_p)
          names = (
              'DESKTOP_UPDATE_PUBLIC_KEY', 'DESKTOP_UPDATE_PRIVATE_KEY', 'LYNX_UPDATE_PRIVATE_KEY',
              'LYNX_ANDROID_KEYSTORE_BASE64', 'LYNX_ANDROID_KEYSTORE_PASSWORD',
              'LYNX_ANDROID_KEY_ALIAS', 'LYNX_ANDROID_KEY_PASSWORD',
          )
          encrypted = {}
          for name in names:
              value = os.environ.pop(name).encode()
              if not value.strip():
                  raise RuntimeError(f'Missing required signing configuration: {name}')
              sealed = ctypes.create_string_buffer(len(value) + sodium.crypto_box_sealbytes())
              if seal(sealed, value, len(value), public_key) != 0:
                  raise RuntimeError(f'Encryption failed: {name}')
              encrypted[name] = base64.b64encode(sealed.raw).decode('ascii')
          output = Path(os.environ['RUNNER_TEMP']) / 'backend-sealed-signing.json'
          output.write_text(json.dumps(encrypted))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-sealed-signing
          path: ${{ runner.temp }}/backend-sealed-signing.json
          if-no-files-found: error
          retention-days: 1
