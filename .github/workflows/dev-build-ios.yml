name: Dev Build (iOS IPA)

# Build the iOS host that embeds our Lynx bundle and produce an UNSIGNED .ipa —
# no code signing, no provisioning profile. The package is meant for
# re-signing by recipients, side-loading on jailbroken devices, or QA inspection.
# Mirrors the Android dev-build.yml; both attach to the same rolling `dev` prerelease.
#
# Manual-only: run from the Actions tab ("Run workflow"). No auto-run on push.
#
# The iOS build is a *device* build (`-sdk iphoneos -destination generic/platform=iOS`),
# so it does not need a simulator runtime — the actool/sim-runtime issue that
# bites the local simulator build does not apply here.
on:
  workflow_dispatch:

# Only keep the latest run per ref.
concurrency:
  group: dev-build-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ios-dev-ipa:
    name: iOS dev IPA (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Front end: build the Lynx bundle, then embed it into the host ----
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Lynx bundle and embed into iOS host
        run: pnpm run build:ios-bundle   # rspeedy build && node scripts/copy-bundle-ios.mjs

      # ---- iOS toolchain ----
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer && xcodebuild -version

      - name: Ensure CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods --no-document
          fi
          pod --version

      - name: pod install
        working-directory: ios
        run: pod install

      # ---- Build the unsigned .app (device, Release, all signing disabled) ----
      # CODE_SIGNING_ALLOWED=NO makes xcodebuild skip code signing entirely and
      # still emit a .app — we then zip it into an unsigned .ipa below.
      - name: Build unsigned .app
        working-directory: ios
        run: |
          xcodebuild \
            -workspace SongloftLynx.xcworkspace \
            -scheme SongloftLynx \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          APP=$(find ios/build/DerivedData/Build/Products -name "SongloftLynx.app" -path "*Release-iphoneos*" -print -quit)
          if [ -z "${APP:-}" ]; then
            echo "No SongloftLynx.app produced" >&2
            find ios/build/DerivedData/Build/Products -maxdepth 3 -type d 2>/dev/null | head -20
            exit 1
          fi
          echo "Found .app: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          # Unsigned build carries no entitlements/_CodeSignature, but strip any
          # stray ephemeral signature just in case so the .ipa is truly unsigned.
          rm -rf "Payload/SongloftLynx.app/_CodeSignature"
          zip -qry songloft-lynx-dev.ipa Payload
          echo "Built unsigned IPA:"
          ls -la songloft-lynx-dev.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: songloft-lynx-dev-ipa
          path: songloft-lynx-dev.ipa
          if-no-files-found: error

      # ---- Rolling `dev` prerelease (same tag as the Android workflow) ----
      - name: Update dev prerelease
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Dev build
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Rolling development build of the Songloft Lynx iOS host — **UNSIGNED**.
            Commit: ${{ github.sha }}

            `songloft-lynx-dev.ipa` is not code-signed and will not install on a
            stock device. Re-sign it with your own developer identity (e.g. via
            `codesign` / fastlane / Sideloadly), or side-load on a jailbroken device.
          files: songloft-lynx-dev.ipa
