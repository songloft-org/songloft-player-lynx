name: Dev Build (Android APK)

# Build the Android host that embeds our Lynx bundle and produce an installable,
# release-signed APK. Mirrors the signing pattern of the Flutter product's
# build-and-release.yml.
#
# Manual-only: run from the Actions tab ("Run workflow"). No auto-run on push.
#
# ── Secrets setup (one-time, via gh CLI): ──────────────────────────────────────
#   gh secret set ANDROID_KEYSTORE_BASE64 < <(base64 -i path/to/release.jks)
#   gh secret set ANDROID_KEYSTORE_PASSWORD --body "your-store-password"
#   gh secret set ANDROID_KEY_ALIAS        --body "your-key-alias"
#   gh secret set ANDROID_KEY_PASSWORD     --body "your-key-password"
# ───────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:

# Only keep the latest run per ref.
concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android-dev-apk:
    name: Android dev APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Front end: build the Lynx bundle, then embed it into the host ----
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Lynx bundle
        run: pnpm run build

      - name: Embed bundle into Android assets
        run: node scripts/copy-bundle-android.mjs

      # ---- Android toolchain ----
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # ---- Signing ----
      - name: Setup Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set — building debug APK"
          fi

      # ---- Build the release APK (falls back to debug signing if no secrets) ----
      - name: Assemble release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          cp "$APK" songloft-lynx-dev.apk
          echo "path=songloft-lynx-dev.apk" >> "$GITHUB_OUTPUT"

      - name: Inspect APK packaging
        run: |
          set -euo pipefail
          APK=songloft-lynx-dev.apk
          stat --format='APK size: %s bytes' "$APK"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT2=""
          if [ -n "$SDK_ROOT" ] && [ -d "$SDK_ROOT/build-tools" ]; then
            AAPT2=$(find "$SDK_ROOT/build-tools" -type f -name aapt2 -print | sort -V | tail -1 || true)
          fi
          if [ -n "$AAPT2" ]; then
            "$AAPT2" dump badging "$APK" | grep -E 'package:|sdkVersion|targetSdkVersion' || true
            "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" |
              grep -E 'minSdkVersion|targetSdkVersion|extractNativeLibs' || true
          else
            echo "aapt2 not found; skipping Manifest inspection"
          fi

          unzip -lv "$APK" | awk '
            $8 ~ /^lib\// {
              if ($2 == "Stored") {
                stored_raw += $1
                stored_zip += $3
              } else if ($2 == "Defl:N") {
                deflated_raw += $1
                deflated_zip += $3
              }
            }
            END {
              printf "Native libs: Stored %d raw / %d in APK; Deflated %d raw / %d in APK\n",
                stored_raw, stored_zip, deflated_raw, deflated_zip
            }
          '

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: songloft-lynx-dev-apk
          path: songloft-lynx-dev.apk
          if-no-files-found: error

      # ---- Rolling `dev` prerelease ----
      - name: Update dev prerelease
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Dev build
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Rolling development build of the Songloft Lynx Android host.
            Commit: ${{ github.sha }}

            Install: enable "install from unknown sources", then side-load
            `songloft-lynx-dev.apk`.
          files: songloft-lynx-dev.apk
