name: Dev Build (HarmonyOS HAP)

# Build the HarmonyOS host that embeds our Lynx bundle and produce an installable,
# signed HAP package. Mirrors the Android dev-build.yml pattern.
#
# Manual-only: run from the Actions tab ("Run workflow"). No auto-run on push.
#
# ── Secrets setup (one-time, via gh CLI): ──────────────────────────────────────
#   gh secret set HARMONY_SIGNING_KEY_BASE64 < <(base64 -i harmony/signing/songloft-release.p12)
#   gh secret set HARMONY_SIGNING_KEY_PASSWORD --body "your-key-password"
#   gh secret set HARMONY_SIGNING_PROFILE_BASE64 < <(base64 -i harmony/signing/Songloft-githubRelease.p7b)
#   gh secret set HARMONY_KEYSTORE_PASSWORD --body "your-keystore-password"
#   gh secret set HARMONY_KEY_ALIAS --body "songloft"  (optional, defaults to songloft)
# ───────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:

concurrency:
  group: dev-build-harmony-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  harmony-dev-hap:
    name: HarmonyOS dev HAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Front end: build the Lynx bundle, then embed it into the host ----
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Lynx bundle
        run: pnpm run build

      - name: Embed bundle into HarmonyOS rawfile
        run: node scripts/copy-bundle-harmony.mjs

      # ---- HarmonyOS toolchain ----
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev

      - name: Setup HarmonyOS CLI tools
        uses: ErBWs/setup-ohos@v2
        with:
          cache: true

      - name: Install ohpm dependencies
        working-directory: harmony
        run: ohpm install

      - name: Patch Lynx SDK (LynxEventReporter crash guard)
        run: bash harmony/scripts/patch-lynx-event-reporter.sh harmony

      # ---- Prepare for unsigned build ----
      - name: Remove signingConfig from build-profile
        working-directory: harmony
        run: |
          node -e "
            const fs = require('fs');
            let profile = fs.readFileSync('build-profile.json5', 'utf8');
            profile = profile.replace(/\"signingConfig\":\s*\"default\",?\s*/g, '');
            fs.writeFileSync('build-profile.json5', profile);
          "

      # ---- Verify native libs are present in oh_modules ----
      - name: Verify native libraries
        working-directory: harmony
        run: |
          echo "=== Native .so files in oh_modules ==="
          find oh_modules -name "*.so" -type f 2>/dev/null
          echo "=== liblynx.so specifically ==="
          find oh_modules -name "liblynx.so" -type f 2>/dev/null

      # ---- Build unsigned HAP ----
      - name: Build HAP
        working-directory: harmony
        run: hvigorw assembleHap --mode module -p product=default -p buildMode=release --no-daemon

      - name: Inspect HAP contents
        working-directory: harmony
        run: |
          HAP=$(find entry/build -name '*.hap' -print -quit)
          if [ -n "$HAP" ]; then
            echo "=== HAP file: $HAP ==="
            echo "=== Native libs in HAP ==="
            unzip -l "$HAP" | grep -i "\.so\|libs/"
            echo "=== All top-level entries ==="
            unzip -l "$HAP" | head -40
          else
            echo "No HAP found after build"
          fi

      # ---- Post-build signing with hap-sign-tool.jar ----
      - name: Sign HAP
        env:
          HARMONY_SIGNING_KEY_BASE64: ${{ secrets.HARMONY_SIGNING_KEY_BASE64 }}
          HARMONY_SIGNING_PROFILE_BASE64: ${{ secrets.HARMONY_SIGNING_PROFILE_BASE64 }}
          HARMONY_SIGNING_CERT_BASE64: ${{ secrets.HARMONY_SIGNING_CERT_BASE64 }}
          HARMONY_KEYSTORE_PASSWORD: ${{ secrets.HARMONY_KEYSTORE_PASSWORD }}
          HARMONY_SIGNING_KEY_PASSWORD: ${{ secrets.HARMONY_SIGNING_KEY_PASSWORD }}
          HARMONY_KEY_ALIAS: ${{ secrets.HARMONY_KEY_ALIAS }}
        run: |
          if [ -z "$HARMONY_SIGNING_KEY_BASE64" ] || [ -z "$HARMONY_SIGNING_CERT_BASE64" ]; then
            echo "::warning::Signing secrets not set — producing unsigned HAP."
            echo "HAP_SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          # Decode signing materials from secrets
          echo "$HARMONY_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/signing-key.p12"
          echo "$HARMONY_SIGNING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing-profile.p7b"
          echo "$HARMONY_SIGNING_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/signing-cert.cer"
          echo "Certificate chain: $(grep -c 'BEGIN CERTIFICATE' "$RUNNER_TEMP/signing-cert.cer") certs"

          # Locate hap-sign-tool.jar in the SDK
          SIGN_TOOL=$(find /home/runner/ohos-sdk -name "hap-sign-tool.jar" -print -quit 2>/dev/null)
          if [ -z "$SIGN_TOOL" ]; then
            # Fallback: check common SDK paths
            for dir in /home/runner/ohos-sdk/command-line-tools/sdk/*/openharmony/toolchains/lib \
                       /home/runner/ohos-sdk/command-line-tools/tool \
                       /home/runner/ohos-sdk/toolchains; do
              if [ -f "$dir/hap-sign-tool.jar" ]; then
                SIGN_TOOL="$dir/hap-sign-tool.jar"
                break
              fi
            done
          fi

          if [ -z "$SIGN_TOOL" ]; then
            echo "::warning::hap-sign-tool.jar not found in SDK — producing unsigned HAP."
            echo "::warning::SDK contents:"
            find /home/runner/ohos-sdk -name "*.jar" 2>/dev/null | head -20
            echo "HAP_SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Using sign tool: $SIGN_TOOL"

          # Find the unsigned HAP
          UNSIGNED_HAP=$(find harmony/entry/build -name '*.hap' -print -quit)
          if [ -z "$UNSIGNED_HAP" ]; then
            echo "::error::No HAP file found to sign"
            exit 1
          fi

          SIGNED_HAP="${UNSIGNED_HAP%.hap}-signed.hap"
          KEY_ALIAS="${HARMONY_KEY_ALIAS:-songloft}"

          # Sign using hap-sign-tool.jar (accepts raw passwords)
          java -jar "$SIGN_TOOL" sign-app \
            -keyAlias "$KEY_ALIAS" \
            -signAlg "SHA256withECDSA" \
            -mode "localSign" \
            -appCertFile "$RUNNER_TEMP/signing-cert.cer" \
            -profileFile "$RUNNER_TEMP/signing-profile.p7b" \
            -keystoreFile "$RUNNER_TEMP/signing-key.p12" \
            -keystorePwd "$HARMONY_KEYSTORE_PASSWORD" \
            -keyPwd "$HARMONY_SIGNING_KEY_PASSWORD" \
            -inFile "$UNSIGNED_HAP" \
            -outFile "$SIGNED_HAP" \
            -signCode "1"

          # Replace unsigned with signed
          mv "$SIGNED_HAP" "$UNSIGNED_HAP"
          echo "HAP signed successfully"
          echo "HAP_SIGNED=true" >> "$GITHUB_ENV"

      - name: Locate HAP
        id: hap
        run: |
          HAP=$(find harmony/entry/build -name '*.hap' -print -quit)
          if [ -z "$HAP" ]; then
            echo "No HAP produced" >&2
            exit 1
          fi
          cp "$HAP" songloft-lynx-dev.hap
          echo "path=songloft-lynx-dev.hap" >> "$GITHUB_OUTPUT"

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: songloft-lynx-dev-hap
          path: songloft-lynx-dev.hap
          if-no-files-found: error

      # ---- Rolling `dev-harmony` prerelease ----
      - name: Update dev-harmony prerelease
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-harmony
          name: Dev build (HarmonyOS)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Rolling development build of the Songloft Lynx HarmonyOS host.
            Commit: ${{ github.sha }}
            Signed: ${{ env.HAP_SIGNED }}

            Install: use DevEco Studio or `hdc install songloft-lynx-dev.hap`
            on a connected HarmonyOS device/emulator.
          files: songloft-lynx-dev.hap
