name: Dev Build (HarmonyOS HAP)

# Build the HarmonyOS host that embeds our Lynx bundle and produce an installable,
# signed HAP package. Mirrors the Android dev-build.yml pattern.
#
# Manual-only: run from the Actions tab ("Run workflow"). No auto-run on push.
#
# ── Secrets setup (one-time, via gh CLI): ──────────────────────────────────────
#   gh secret set HARMONY_SIGNING_KEY_BASE64 < <(base64 -i path/to/signing-key.p12)
#   gh secret set HARMONY_SIGNING_KEY_PASSWORD --body "your-key-password"
#   gh secret set HARMONY_SIGNING_PROFILE_BASE64 < <(base64 -i path/to/signing-profile.p7b)
#   gh secret set HARMONY_KEYSTORE_PASSWORD --body "your-keystore-password"
# ───────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:

concurrency:
  group: dev-build-harmony-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  harmony-dev-hap:
    name: HarmonyOS dev HAP
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lynx-family/ubuntu24.04-harmony@sha256:bf493c3710de3c44bfa84caf402c0727b9310c42497f6e52580ad441ea640ef1
    steps:
      - uses: actions/checkout@v4

      # ---- Front end: build the Lynx bundle, then embed it into the host ----
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Lynx bundle
        run: pnpm run build

      - name: Embed bundle into HarmonyOS rawfile
        run: node scripts/copy-bundle-harmony.mjs

      # ---- HarmonyOS: install ohpm dependencies ----
      - name: Install ohpm dependencies
        working-directory: harmony
        run: ohpm install

      # ---- Signing ----
      - name: Setup HarmonyOS signing
        env:
          HARMONY_SIGNING_KEY_BASE64: ${{ secrets.HARMONY_SIGNING_KEY_BASE64 }}
          HARMONY_SIGNING_PROFILE_BASE64: ${{ secrets.HARMONY_SIGNING_PROFILE_BASE64 }}
        run: |
          if [ -n "$HARMONY_SIGNING_KEY_BASE64" ]; then
            echo "$HARMONY_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/signing-key.p12"
            echo "$HARMONY_SIGNING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing-profile.p7b"
            echo "HARMONY_SIGNING_KEY_PATH=$RUNNER_TEMP/signing-key.p12" >> "$GITHUB_ENV"
            echo "HARMONY_SIGNING_PROFILE_PATH=$RUNNER_TEMP/signing-profile.p7b" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set — building unsigned HAP (debug)"
          fi

      - name: Generate signing config
        working-directory: harmony
        env:
          HARMONY_KEYSTORE_PASSWORD: ${{ secrets.HARMONY_KEYSTORE_PASSWORD }}
          HARMONY_SIGNING_KEY_PASSWORD: ${{ secrets.HARMONY_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$HARMONY_SIGNING_KEY_PATH" ]; then
            node -e "
              const fs = require('fs');
              const profile = fs.readFileSync('build-profile.json5', 'utf8');
              const signingConfig = {
                name: 'default',
                type: 'HarmonyOS',
                material: {
                  certpath: '',
                  storePassword: process.env.HARMONY_KEYSTORE_PASSWORD || '',
                  keyAlias: 'songloft',
                  keyPassword: process.env.HARMONY_SIGNING_KEY_PASSWORD || '',
                  profile: process.env.HARMONY_SIGNING_PROFILE_PATH,
                  signAlg: 'SHA256withECDSA',
                  storeFile: process.env.HARMONY_SIGNING_KEY_PATH
                }
              };
              const updated = profile.replace(
                '\"signingConfigs\": []',
                '\"signingConfigs\": [' + JSON.stringify(signingConfig) + ']'
              );
              fs.writeFileSync('build-profile.json5', updated);
            "
            echo "Signing config injected"
          else
            echo "Skipping signing config (unsigned build)"
          fi

      # ---- Build the HAP ----
      - name: Build HAP
        working-directory: harmony
        run: |
          if [ -n "$HARMONY_SIGNING_KEY_PATH" ]; then
            hvigorw assembleHap --mode module -p product=default -p buildMode=release --no-daemon
          else
            hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon
          fi

      - name: Locate HAP
        id: hap
        run: |
          HAP=$(find harmony/entry/build -name '*.hap' -print -quit)
          if [ -z "$HAP" ]; then
            echo "No HAP produced" >&2
            exit 1
          fi
          cp "$HAP" songloft-lynx-dev.hap
          echo "path=songloft-lynx-dev.hap" >> "$GITHUB_OUTPUT"

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: songloft-lynx-dev-hap
          path: songloft-lynx-dev.hap
          if-no-files-found: error

      # ---- Rolling `dev-harmony` prerelease ----
      - name: Update dev-harmony prerelease
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-harmony
          name: Dev build (HarmonyOS)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Rolling development build of the Songloft Lynx HarmonyOS host.
            Commit: ${{ github.sha }}

            Install: use DevEco Studio or `hdc install songloft-lynx-dev.hap`
            on a connected HarmonyOS device/emulator.
          files: songloft-lynx-dev.hap
