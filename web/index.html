<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Songloft</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/app_icon.png">
  <link rel="apple-touch-icon" href="/app_icon.png">
  <!--
    These two names must match what scripts/copy-bundle-web.mjs actually copies,
    i.e. @lynx-js/web-core's client_prod assets (client.css / client.js). They
    used to say index.css / index.js — the dev-middleware naming — so `build:web`
    produced a page that 404'd both entry files and rendered a black screen,
    while `web:dev` worked because serve.mjs was reading a different directory.
    A vitest gate now asserts every local ref here exists in the output.
  -->
  <link href="/web-core/static/css/client.css" rel="stylesheet">
  <!--
    Preload hints for web-core's WASM engine. client.js only discovers these once
    it executes, so the hint overlaps their download with script parsing.

    Two rules here, both established by counting requests in a CDP network log
    rather than by reasoning about what ought to help:

    1. NO `crossorigin` attribute. A preload only satisfies a later request when
       the two agree on credentials mode; web-core uses a bare `fetch(url)`
       (`same-origin`), so `crossorigin="anonymous"` (`omit`) makes every entry
       unusable. With it, these two wasm files downloaded TWICE (403 KB wasted)
       and the console showed "was preloaded using link preload but not used
       within a few seconds". Without it, the preload is reused and the net cost
       is zero. That warning always means the hint is pure bandwidth — never that
       it needs a different `as`.

    2. There is deliberately NO hint for `/main.lynx.bundle`, even though at
       1.9 MB it is by far the largest asset and therefore the tempting one. It
       CANNOT be hit: web-core fetches it from inside
       `web-core-template-loader-thread.js` — a Worker — and the preload cache is
       per-realm, so a worker fetch never consults the document's. (It also sends
       `Accept: application/octet-stream, application/json`, which would not match
       a preload's `*/*`.) Adding it measured as a straight 1.9 MB of duplicate
       download: total page weight 5270 KB with the hint vs 3346 KB without, with
       first content unchanged at ~0.2 s. The levers that do work on the bundle
       are its size and HTTP caching. A vitest gate keeps this hint out.

    The WASM filenames are hashed per @lynx-js/web-core version; serve.mjs and
    copy-bundle-web.mjs both rewrite them from the actual wasm/ directory, so the
    hashes below are only a template.
  -->
  <link rel="preload" as="fetch" href="/web-core/static/wasm/e5defb6b3b.module.wasm">
  <link rel="preload" as="fetch" href="/web-core/static/wasm/4c5aa2efc5.module.wasm">
  <!--
    Main-thread crash/console capture, inline and FIRST so it is installed before
    web-core's client module runs.

    Why this has to live here rather than in the app: on Web the app's own code
    runs inside web-core's Worker, so `client-logger.ts` only ever sees the
    worker realm. Everything web-core does to the DOM — `rLynxChange`,
    `__FlushElementTree`, the wasm element bridge — happens on the *main* thread,
    and a throw there (e.g. "recursive use of an object … in rust") is invisible
    to the worker's logger. Those were reported from a browser console and could
    not be reproduced from an exported log, because the export had no main-thread
    side at all.

    The bridge is the same IndexedDB the app uses for storage (`idb-storage.ts`):
    both realms can open it with no host wiring, so the worker can fold these
    lines into `frontend.log` at export time. Kept to plain ES5 with no imports —
    it must not depend on anything that could itself fail to load.
  -->
  <script>
    (function () {
      var DB = 'songloft', VER = 1, STORE = 'kv', KEY = 'prefs.__mainlog', MAX = 400
      var lines = [], timer = null

      // Open the DB, run the supplied callback, then close the connection.
      // Keeping the connection open (the previous implementation cached dbp)
      // could block the app's Worker from opening the same database in some
      // browsers, causing secure tokens to fall back to the in-memory mirror
      // and disappear after a page reload.
      function withDB(fn) {
        return new Promise(function (resolve) {
          try {
            var req = indexedDB.open(DB, VER)
            req.onupgradeneeded = function () {
              var db = req.result
              if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE)
            }
            req.onsuccess = function () {
              try { fn(req.result, resolve) } catch (e) { resolve(null) }
            }
            req.onerror = function () { resolve(null) }
            req.onblocked = function () { resolve(null) }
          } catch (e) { resolve(null) }
        })
      }

      function pad(n, w) { return String(n).padStart(w, '0') }
      function stamp() {
        var d = new Date()
        return pad(d.getHours(), 2) + ':' + pad(d.getMinutes(), 2) + ':'
          + pad(d.getSeconds(), 2) + '.' + pad(d.getMilliseconds(), 3)
      }
      // Same redaction as the TS logger: an exported log must never carry a
      // usable credential.
      function redact(s) {
        return String(s).replace(/((?:access_token|token)=)[^&\s]+/gi, '$1***')
      }

      function flush() {
        timer = null
        var snapshot = lines.slice(-MAX)
        withDB(function (db, done) {
          if (!db) return done(null)
          try {
            var tx = db.transaction(STORE, 'readwrite')
            tx.objectStore(STORE).put(JSON.stringify(snapshot), KEY)
            tx.oncomplete = function () { db.close(); done(null) }
            tx.onerror = function () { db.close(); done(null) }
            tx.onabort = function () { db.close(); done(null) }
          } catch (e) { db.close(); done(null) }
        })
      }

      function push(level, msg) {
        lines.push('[' + stamp() + '] ' + level + '/main ' + redact(msg))
        if (lines.length > MAX) lines = lines.slice(-MAX)
        // Batched: a burst of identical wasm errors would otherwise open one
        // transaction each.
        if (timer === null) timer = setTimeout(flush, 400)
      }

      function describe(v) {
        if (v && v.stack) return (v.name || 'Error') + ': ' + v.message + ' | '
          + String(v.stack).split('\n').slice(0, 4).join(' ⏎ ')
        return String(v)
      }

      /*
        Startup stage marks, in ms since navigation start.

        Why the host page and not the app: a blank screen means the app never got
        to paint, so anything measured from inside it cannot report on the gap.
        Every boundary below is observable ONLY from the main thread — web-core's
        MTS iframe handshake, the <lynx-view> upgrade, and the moment content
        first lands in the shadow root (the app renders into the shadow root, so
        the light DOM stays empty and is not a usable signal — measuring it is how
        a fast page can look like a dead one).

        These ride the same IndexedDB channel as the crash capture above, so they
        come out in Settings → Diagnostics → export log with no extra wiring.
        A blank-screen report is then a matter of reading which gap is large,
        instead of guessing: `mts-ready` covers web-core booting its engine,
        `first-content` closes when the app's first frame is actually on screen.
      */
      function mark(name) {
        push('I', 'boot ' + name + ' +' + Math.round(performance.now()) + 'ms')
      }
      mark('host-script')
      window.addEventListener('load', function () { mark('window-load') })
      // web-core signals its main-thread realm is up by postMessage-ing from the
      // sandboxed srcdoc iframe it puts in the shadow root.
      window.addEventListener('message', function (e) {
        if (e.data === 'lynx:mtsready') mark('mts-ready')
      })
      // First paint of app content. The shadow root is created during the
      // <lynx-view> upgrade, so poll briefly for it, then observe.
      ;(function () {
        var started = performance.now()
        var seen = false
        function watch() {
          var v = document.getElementById('app')
          var sr = v && v.shadowRoot
          if (!sr) {
            // Give up after 30s rather than poll forever; that itself is a datum.
            if (performance.now() - started > 30000) mark('no-shadow-root-30s')
            else setTimeout(watch, 50)
            return
          }
          var check = function () {
            if (seen) return
            if ((sr.textContent || '').trim().length === 0) return
            seen = true
            mark('first-content')
            if (obs) obs.disconnect()
          }
          var obs = null
          try {
            obs = new MutationObserver(check)
            obs.observe(sr, { childList: true, subtree: true, characterData: true })
          } catch (e) { /* fall back to the poll below */ }
          check()
          /*
            Flash timeline: WHICH screen painted WHEN (login / splash / home /
            other), so a reported "the login page flashes on refresh" is a
            matter of reading the log instead of eyeballing a 200ms frame.
            Samples on mutation + a 100ms poll for 8s, then folds the state
            transitions into one `boot flash …` line on the same mainlog
            channel (Settings → Diagnostics → export, or the IDB value
            directly). Deliberately permanent: this file's whole reason is
            post-hoc diagnosis of paint gaps.
          */
          var states = []
          var lastState = null
          var recObs = null
          function stateOf() {
            var text = sr.textContent || ''
            if (text.indexOf('登录以继续') !== -1) return 'login'
            if (sr.querySelector('[data-testid="splash"]')) return 'splash'
            if (sr.querySelector('[data-testid="home-greeting"]')) return 'home'
            return text.trim() ? 'other' : 'empty'
          }
          function sample() {
            var s = stateOf()
            if (s !== lastState) {
              lastState = s
              var ids = []
              var all = sr.querySelectorAll('[data-testid]')
              for (var i2 = 0; i2 < all.length && ids.length < 6; i2++) ids.push(all[i2].getAttribute('data-testid'))
              var line = s + '@' + Math.round(performance.now() - started) + ' [' + ids.join(',') + ']'
              states.push(line)
              // Log each transition immediately (mutation-driven, so it does
              // not depend on the summary timer chain completing — background
              // tabs throttle setTimeout hard).
              push('I', 'boot paint ' + line)
            }
          }
          try {
            recObs = new MutationObserver(sample)
            recObs.observe(sr, { childList: true, subtree: true, characterData: true })
          } catch (e) { /* poll below is the backstop */ }
          var samples = 0
          ;(function recPoll() {
            sample()
            if (++samples > 80) {
              if (recObs) recObs.disconnect()
              push('I', 'boot flash ' + states.join(' '))
              return
            }
            setTimeout(recPoll, 100)
          })()
          // MutationObserver misses text committed inside nested shadow roots,
          // so keep a slow poll as the backstop until content is seen.
          ;(function poll() {
            if (seen) return
            if (performance.now() - started > 30000) { mark('no-content-30s'); return }
            check()
            setTimeout(poll, 100)
          })()
        }
        watch()
      })()

      window.addEventListener('error', function (e) {
        push('E', 'uncaught ' + (e.error ? describe(e.error) : e.message)
          + (e.filename ? ' @' + e.filename + ':' + (e.lineno || 0) : ''))
      })
      window.addEventListener('unhandledrejection', function (e) {
        push('E', 'unhandled rejection ' + describe(e.reason))
      })
      // console.error is wrapped as well: web-core reports the wasm failure
      // through it (that is why the reported stack was attributed to React
      // DevTools' installHook), so window.onerror alone would miss it.
      var methods = ['warn', 'error']
      for (var i = 0; i < methods.length; i++) {
        (function (m) {
          var orig = console[m].bind(console)
          console[m] = function () {
            orig.apply(null, arguments)
            try {
              var parts = []
              for (var j = 0; j < arguments.length; j++) {
                var a = arguments[j]
                parts.push(a && a.stack ? describe(a) : String(a))
              }
              push(m === 'error' ? 'E' : 'W', parts.join(' '))
            } catch (err) { /* never recurse into console */ }
          }
        })(methods[i])
      }
      push('I', 'main-thread capture installed')
    })()
  </script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      overscroll-behavior: none;
    }
    lynx-view {
      width: 100vw;
      height: 100vh;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Remove transform-vh/vw: they cause content height mismatch and pull-to-refresh -->
  <!--
    `global-props` is read synchronously when web-core upgrades this element
    (attributeChangedCallback → JSON.parse → globalProps), so the tag reaches the
    worker BEFORE the bundle runs. The app cannot probe this on its own: the
    worker realm has `self.location` in both deploys, so "is this a browser?"
    cannot tell a standalone page (this static server — no backend, no /api
    proxy) from an embedded one (same-origin backend). Without the tag, a fresh
    browser gets the API-address field hidden AND the base URL defaulted to this
    server's own origin, and cannot log in at all.
    `copy-bundle-web.mjs --embedded` STRIPS this attribute for the embedded
    build, where the same-origin probe is correct. Key must match
    GLOBAL_PROP_DEPLOY_MODE in src/core/config/app-config.ts.
  -->
  <lynx-view
    id="app"
    url="/main.lynx.bundle"
    global-props='{"deployMode":"standalone"}'
  ></lynx-view>

  <!--
    audio-host.js MUST load before the web-core client module so
    nativeModulesMap is populated when the LynxView custom element upgrades.
    It registers a main-thread HTMLAudioElement as NativeModules.SongloftAudio,
    unlocking the same NativeSongloftAudio path used on Android/iOS.

    It is placed AFTER the <lynx-view> element (so document.getElementById('app')
    finds it) but BEFORE the web-core client module (so nativeModulesMap is set
    before the custom element upgrades and reads it).

    Both scripts use `defer` so they do not block HTML parsing. Execution order
    is preserved (deferred scripts run in order, before module scripts), so
    hls.min.js → audio-host.js → webview-host.js → client.js still holds.
  -->
  <script defer src="/hls.min.js"></script>
  <script defer src="/audio-host.js"></script>
  <!--
    The plugin iframe host, registering NativeModules.SongloftWebview the same
    way audio-host.js registers its three modules. Order constraints are the
    same: after audio-host.js (it merges into the nativeModulesMap that file
    creates) and before the web-core client module (the map must be complete
    when <lynx-view> upgrades). See web/webview-host.js.
  -->
  <script defer src="/webview-host.js"></script>
  <script defer src="/lynx-frame-host.js"></script>

  <!--
    Alias `blur-view` onto web-core's `x-blur-view`.

    web-core creates elements with
    `document.createElement(LYNX_TAG_TO_HTML_TAG_MAP[tag] ?? tag)`, and that map
    holds only view/text/image/raw-text/scroll-view/wrapper/list/page/input/
    textarea/svg/frame. `blur-view` is not in it, so the **identity fallback**
    applies and `<blur-view>` lands in the DOM as the literal tag `blur-view` —
    an inert `HTMLUnknownElement` whose attributes do nothing (the trap in
    `docs/architecture/lynx-constraints.md` §四). Meanwhile web-elements DOES
    ship the real implementation, registered under the name `x-blur-view`.

    So the element and the tag both exist and simply never meet. Without this
    alias every modal backdrop blur is a silent no-op **on Web only** — which is
    exactly how it shipped: the runtime check that "verified" it had constructed
    an `x-blur-view` by hand, bypassing the mapping it was supposed to exercise.

    Registered by name rather than by adding to web-core's map because that map
    is a frozen module constant. `whenDefined` because web-elements arrives in an
    async chunk, so the class may not exist when this runs.
  -->
  <script>
    (function () {
      customElements.whenDefined('x-blur-view').then(function () {
        if (customElements.get('blur-view')) return
        var XBlurView = customElements.get('x-blur-view')
        // A bare subclass: the implementation reads its own `blur-radius`
        // attribute and writes `:host { backdrop-filter: blur(Npx) }` into its
        // shadow root, so it carries nothing that is keyed to the tag name.
        customElements.define('blur-view', class extends XBlurView {})
      }).catch(function () { /* no blur on this host; scrims still dim */ })
    })()
  </script>

  <!--
    `type="module"` is REQUIRED, not stylistic: web-core's production client
    (client_prod) uses `import.meta`, so loading it as a classic script dies with
    "Cannot use 'import.meta' outside a module" — an uncaught exception that never
    reaches console.error, so the page just stays black with no diagnostic. (The
    dev-middleware build is a plain IIFE and does not have this constraint, which
    is why `web:dev` used to work while `build:web` did not.) Modules are deferred
    by default, so the old `defer` attribute is now redundant.
  -->
  <script type="module" src="/web-core/static/js/client.js"></script>
  <script>
    (function() {
      var lynxView = document.getElementById('app');

      /*
        Initial theme/locale: there is deliberately NO globalProps assignment
        here. The block this replaces listened for a `lynxviewready` event that
        @lynx-js/web-core 0.23.1 never dispatches (verified against the shipped
        client.js — only a post-first-frame `load` event exists), so the
        assignment never ran; it was dead code, removed rather than "fixed".
        Initial values that must precede the bundle belong in the
        `global-props` attribute above, which IS read synchronously on upgrade.
      */
      /*
        Two things this call used to get wrong, both silent:

        - `sendGlobalEvent`'s second argument is an **array** of params, not the
          payload. web-core ends up doing `listener.apply(ctx, params)`, and a plain
          object has no `length`, so the listener was invoked with no arguments at
          all and `parseSystemAppearance(undefined)` reported "host said nothing".
        - the keys must be `systemTheme` / `systemLocale` — the same names as the
          globalProps above, because `src/native/system-appearance.ts` reads one
          parser over both channels. `theme` matched nothing.

        `systemLocale` is resent unchanged: the parser treats a missing key as "host
        said nothing", and the appearance is applied as a whole, so sending only the
        theme would have reset the language to the default on the first switch.
      */
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        lynxView.sendGlobalEvent('SongloftSystem.appearanceChanged', [{
          systemTheme: e.matches ? 'dark' : 'light',
          systemLocale: navigator.language.startsWith('zh') ? 'zh' : 'en'
        }]);
      });
    })();
  </script>
</body>
</html>
