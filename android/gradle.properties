# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
# minSdk 21 (< 24) turns on D8 desugaring of Java 8 default interface methods:
# the body moves to an `Interface$-CC` class and every implementer gets a
# forwarding method injected. By default AGP dexes each external library on its
# own, deriving the desugaring classpath from that library's *declared* POM
# dependencies -- so a library whose POM omits the module holding the interface
# gets desugared blind: the interface loses its default body, the implementer
# never gets a forwarder, and the call dies with AbstractMethodError at runtime
# while the build stays green.
# `lynx-service-devtool`'s POM declares only `service-api` + `debug-router`, but
# `ILynxDevToolService` (and `ILynxHttpService`) live in the `lynx` artifact ==>
# `LynxDevToolService` shipped without `getServiceClass()` and every launch
# crashed in Application.onCreate. `lynx-service-log` / `-image` survived purely
# because their interfaces happen to sit in the `service-api` they do declare.
# This flag makes the dexing transform desugar against the full runtime
# classpath, which is the only fix that does not require raising minSdk back to
# 24. No build-time gate can catch a regression here -- after an AGP or Lynx
# upgrade, re-check the APK itself:
#   dexdump -d classes*.dex | grep -A400 "Lcom/lynx/service/devtool/LynxDevToolService;"
# must list a `getServiceClass` method.
android.useFullClasspathForDexingTransform=true